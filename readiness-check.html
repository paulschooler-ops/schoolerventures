<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SV-BOSS Readiness Check — Schooler Ventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Readiness Check — scoped styles, built on the shared brand variables in styles.css */

    .readiness-section {
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      padding: 3rem 0;
    }

    .readiness-wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .readiness-intro h1 {
      color: var(--deep-forest);
      font-size: clamp(1.7rem, 3.5vw, 2.4rem);
      margin: 0 0 0.75rem;
    }

    .readiness-intro p {
      color: var(--text-color);
      max-width: 52ch;
    }

    /* Progress */

    .rc-progress-track {
      background: rgba(37, 59, 47, 0.12);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 0.6rem;
    }

    .rc-progress-fill {
      background: var(--warm-gold);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .rc-progress-label {
      font-size: 0.8rem;
      color: var(--deep-forest);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 2rem;
    }

    /* Card */

    .rc-card {
      background: var(--white);
      border-radius: 10px;
      padding: 2.25rem;
      box-shadow: 0 10px 30px rgba(37, 59, 47, 0.08);
      border: 1px solid rgba(37, 59, 47, 0.08);
    }

    .rc-step { display: none; }
    .rc-step.active { display: block; animation: rc-fade-in 0.3s ease; }

    @keyframes rc-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rc-question {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--deep-forest);
      margin: 0 0 0.4rem;
    }

    .rc-help {
      font-size: 0.9rem;
      color: #667;
      margin: 0 0 1.25rem;
    }

    .rc-field {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      border: 2px solid rgba(37, 59, 47, 0.18);
      border-radius: 6px;
      background: var(--warm-cream);
      color: var(--text-color);
      transition: border-color 0.2s ease;
    }

    .rc-field:focus {
      outline: none;
      border-color: var(--warm-gold);
    }

    textarea.rc-field {
      resize: vertical;
      min-height: 110px;
      line-height: 1.5;
    }

    .rc-error {
      color: var(--rust);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.1em;
    }

    .rc-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .rc-two-col .rc-subfield label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--deep-forest);
      margin-bottom: 0.35rem;
    }

    @media (max-width: 560px) {
      .rc-two-col { grid-template-columns: 1fr; }
      .rc-card { padding: 1.5rem; }
    }

    /* Nav buttons */

    .rc-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.75rem;
    }

    .rc-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.6rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .rc-btn-primary {
      background: var(--deep-forest);
      color: var(--white);
      margin-left: auto;
    }

    .rc-btn-primary:hover { opacity: 0.9; }
    .rc-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .rc-btn-secondary {
      background: transparent;
      color: var(--deep-forest);
      border-color: rgba(37, 59, 47, 0.25);
    }

    .rc-btn-secondary:hover {
      background: var(--deep-forest);
      color: var(--white);
    }

    .rc-btn-secondary:disabled { visibility: hidden; }

    /* Review step */

    .rc-review-list {
      list-style: none;
      margin: 0 0 1.5rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .rc-review-list li {
      border-bottom: 1px solid rgba(37, 59, 47, 0.1);
      padding-bottom: 0.9rem;
    }

    .rc-review-q {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--warm-gold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 0.2rem;
    }

    .rc-review-a {
      margin: 0;
      color: var(--text-color);
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .rc-review-a.rc-empty {
      color: #999;
      font-style: italic;
    }

    /* Success / error states */

    .rc-status {
      text-align: center;
      padding: 1rem 0;
    }

    .rc-status h2 {
      color: var(--deep-forest);
      margin-bottom: 0.5rem;
    }

    .rc-status p {
      color: var(--text-color);
    }

    .rc-status.rc-error-state h2 {
      color: var(--rust);
    }

    .rc-honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-link" aria-label="Schooler Ventures — Home">
        <img src="images/schooler-ventures-logo.png" alt="Schooler Ventures">
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link">Explore</a>
        <a href="sv-boss.html" class="nav-link" aria-current="page">SV-BOSS</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="readiness-section">
      <div class="readiness-wrap">

        <div class="readiness-intro" id="rc-intro">
          <h1>SV-BOSS Readiness Check</h1>
          <p>Eleven quick questions. A few minutes of your time gives us a clear picture of where your business stands today &mdash; and what's possible next.</p>
        </div>

        <div class="rc-progress-track" id="rc-progress-track" style="display:none;">
          <div class="rc-progress-fill" id="rc-progress-fill"></div>
        </div>
        <p class="rc-progress-label" id="rc-progress-label" style="display:none;"></p>

        <form class="rc-card" id="rc-form" novalidate>
          <!-- Honeypot field — hidden from real users, catches simple bots -->
          <div class="rc-honeypot" aria-hidden="true">
            <label for="rc-website-hp">Leave this field empty</label>
            <input type="text" id="rc-website-hp" name="website_hp" tabindex="-1" autocomplete="off">
          </div>

          <div id="rc-steps"></div>

          <div id="rc-status-area"></div>
        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Schooler Ventures. All rights reserved.</p>
    </div>
  </footer>

  <script src="readiness-check.js" defer></script>
</body>
</html>
